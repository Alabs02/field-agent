name: field-agent

# `docker compose up` brings up everything: Postgres, Redis, migrations + seed,
# the API, the worker, and the web UI. No .env is required; every value below
# has a default. Copy .env.example to .env to override any of them.
#
#   web         http://localhost:3000        (product at /app)
#   api         http://localhost:4000        (/docs, /health, /admin/queues)
#
# Optional browser engine:  docker compose --profile browser up

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://fieldagent:fieldagent@postgres:5432/fieldagent
  REDIS_URL: redis://redis:6379
  PORTAL_ID: briargate

x-scrape-env: &scrape-env
  SCRAPE_USER_AGENT: ${SCRAPE_USER_AGENT:-FieldAgentBot/0.1 (+https://github.com/Alabs02/field-agent; alabson.inc@gmail.com)}
  # robots.txt asks for 60s between requests. 2s locally so the first scrape
  # takes ~2 minutes; see ASSUMPTIONS.md. Set SCRAPE_RESPECT_CRAWL_DELAY=true
  # (and/or SCRAPE_MIN_DELAY_MS=60000) for the production posture.
  SCRAPE_MIN_DELAY_MS: ${SCRAPE_MIN_DELAY_MS:-2000}
  SCRAPE_RESPECT_CRAWL_DELAY: ${SCRAPE_RESPECT_CRAWL_DELAY:-false}
  SCRAPE_FETCH_TIMEOUT_MS: ${SCRAPE_FETCH_TIMEOUT_MS:-20000}
  SCRAPE_JOB_TIMEOUT_MS: ${SCRAPE_JOB_TIMEOUT_MS:-5400000}
  VERIFY_JOB_TIMEOUT_MS: ${VERIFY_JOB_TIMEOUT_MS:-1800000}
  VERIFY_SAMPLE_RATE: ${VERIFY_SAMPLE_RATE:-0.2}
  BRAND_REFRESH_HOURS: ${BRAND_REFRESH_HOURS:-24}
  SNAPSHOT_MODE: ${SNAPSHOT_MODE:-changed}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fieldagent
      POSTGRES_PASSWORD: fieldagent
      POSTGRES_DB: fieldagent
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldagent -d fieldagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies committed migrations, seeds the portal row and demo users.
  migrate:
    build:
      context: .
      target: api
    image: field-agent-api
    command: ["node", "dist/cli.js", "migrate", "seed"]
    environment:
      <<: *app-env
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me-please-32chars}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-FieldAgent-Demo-2026!}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: api
    image: field-agent-api
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      <<: *app-env
      API_PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me-please-32chars}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://api:4000}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-FieldAgent-Demo-2026!}
      SCRAPE_ON_BOOT: ${SCRAPE_ON_BOOT:-true}
      VERIFY_SAMPLE_RATE: ${VERIFY_SAMPLE_RATE:-0.2}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-120}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # One worker service; the image target and engine are chosen together so browser mode never
  # starts the HTTP worker alongside it:
  #   docker compose up                                              -> HTTP engine (default)
  #   WORKER_TARGET=worker-browser SCRAPE_ENGINE=playwright docker compose up --build
  worker:
    build:
      context: .
      target: ${WORKER_TARGET:-worker}
    image: field-agent-${WORKER_TARGET:-worker}
    environment:
      <<: [*app-env, *scrape-env]
      SCRAPE_ENGINE: ${SCRAPE_ENGINE:-http}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s

  web:
    build:
      context: .
      target: web
    image: field-agent-web
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      API_URL: http://api:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      # Shown on the login page; must match what migrate seeded.
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-FieldAgent-Demo-2026!}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
