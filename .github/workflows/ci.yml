name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run typecheck lint test build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  compose-smoke:
    name: docker compose up smoke test
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - name: Bring the stack up (no scrape on boot; CI must not hit the portal)
        run: SCRAPE_ON_BOOT=false docker compose up -d --build --wait --wait-timeout 600
      - name: API and web health
        run: |
          curl -fsS http://localhost:4000/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://localhost:3000/health | grep -q '"status":"ok"'
      - name: Worker is healthy, not crash-looping
        run: |
          docker compose ps --format '{{.Name}} {{.Status}}' | tee /dev/stderr | grep -E 'worker-1 +Up .*(healthy)'
          docker compose logs worker --no-color | grep -q 'worker ready'
      - name: Empty state is honest, not empty-bodied
        run: |
          curl -fsS 'http://localhost:4000/promotions' | grep -q '"total":0'
          curl -fsS -o /dev/null -w '%{http_code}\n' 'http://localhost:4000/promotions?pageSize=999' | grep -q 400
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -200
      - if: always()
        run: docker compose down -v
